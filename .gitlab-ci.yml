# GitLab CI - ACTIVE pipeline for AgentSynapse
# Truth: badge image URLs are only trusted after live 200-SVG probes (see AGENTS.md).
# Coverage is parsed by GitLab from the "Test Coverage:" line emitted by skills.py --check --profile.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - deploy

skills-syntax:
  stage: test
  image: python:3.12-slim
  before_script:
    - python -m py_compile skills.py
  script:
    - python skills.py --version
    - python skills.py --list
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

skills-profile-coverage:
  stage: test
  image: python:3.12-slim
  before_script:
    - python -m py_compile skills.py
  script:
    - python skills.py --check --profile temel
    - python skills.py --check --profile hepsi
  coverage: '/Test Coverage: (\d+)%/'
  artifacts:
    paths:
      - coverage.xml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  image: alpine:3.21
  script:
    - mkdir -p public
    - cp -r docs/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH